name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to publish; rollback refs must support Nightly release interface v4"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-release
  cancel-in-progress: false

env:
  PROJECT_NAME: MacTools
  APP_PRODUCT_NAME: MacTools Nightly
  SCHEME: MacTools
  CONFIGURATION: Nightly
  DERIVED_DATA: build/DerivedDataNightly
  NIGHTLY_RETENTION_COUNT: 14
  NIGHTLY_RELEASE_INTERFACE_VERSION: 4

jobs:
  build:
    name: Build, sign, and notarize Nightly
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_NIGHTLY_RELEASES == 'true' }}
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      decision: ${{ steps.nightly_gate.outputs.decision }}
      source_sha: ${{ steps.selected_source.outputs.source_sha }}
      run_attempt: ${{ steps.nightly_metadata.outputs.run_attempt }}
      artifact_id: ${{ steps.nightly_candidate.outputs.artifact-id }}

    steps:
      - name: Checkout selected source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate selected source release interface
        id: selected_source
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "Nightly source $SOURCE_SHA is not part of origin/main; refusing to expose release credentials." >&2
            exit 1
          fi
          if ! SOURCE_RELEASE_INTERFACE="$(scripts/nightly-release.py release-interface-version 2>/dev/null)" \
            || [[ "$SOURCE_RELEASE_INTERFACE" != "$NIGHTLY_RELEASE_INTERFACE_VERSION" ]] \
            || [[ ! -f docs/testing/cli-nightly-distribution.md ]]; then
            echo "Nightly rollback refs must support release interface v${NIGHTLY_RELEASE_INTERFACE_VERSION}, including the CLI testing guide." >&2
            exit 1
          fi
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Set Nightly metadata
        id: nightly_metadata
        run: |
          scripts/nightly-release.py metadata \
            --app-version-config Configs/AppVersion.xcconfig \
            --plugins-dir Plugins \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --github-env "$GITHUB_ENV"
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish Nightly
        id: nightly_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "decision=publish" >> "$GITHUB_OUTPUT"
            echo "Manual run: forced Nightly publication." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PREVIOUS_SOURCE_SHA=""
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            APPCAST_PATH="$RUNNER_TEMP/advertised-nightly-appcast.xml"
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              "https://mactools.ggbond.app/nightly/appcast.xml" \
              --output "$APPCAST_PATH" \
              && PREVIOUS_TAG="$(scripts/nightly-release.py appcast-tag --input "$APPCAST_PATH")"; then
              PREVIOUS_SOURCE_SHA="$(gh release view "$PREVIOUS_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --json targetCommitish,isDraft,isPrerelease \
                --jq 'if .isDraft == false and .isPrerelease == true then .targetCommitish else "" end')" \
                || PREVIOUS_SOURCE_SHA=""
            fi
          fi
          scripts/nightly-release.py publication-decision \
            --event-name "$GITHUB_EVENT_NAME" \
            --source-sha "$SOURCE_SHA" \
            --previous-source-sha "$PREVIOUS_SOURCE_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Report unchanged Nightly
        if: steps.nightly_gate.outputs.decision == 'unchanged'
        run: echo "No source changes since the advertised Nightly; publication skipped."

      - name: Validate required secrets
        if: steps.nightly_gate.outputs.decision == 'publish'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          BUNDLE_IDENTIFIER_PREFIX: ${{ secrets.BUNDLE_IDENTIFIER_PREFIX }}
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          PLUGIN_CATALOG_PRIVATE_KEY_BASE64: ${{ secrets.PLUGIN_CATALOG_PRIVATE_KEY_BASE64 }}
        run: |
          missing=0
          for name in \
            APPLE_DEVELOPMENT_TEAM \
            BUNDLE_IDENTIFIER_PREFIX \
            DEVELOPER_ID_CERT_P12 \
            DEVELOPER_ID_CERT_PASSWORD \
            ASC_API_KEY_P8_BASE64 \
            ASC_API_KEY_ID \
            ASC_API_ISSUER_ID \
            SPARKLE_PRIVATE_KEY \
            PLUGIN_CATALOG_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify plugin catalog signing key
        if: steps.nightly_gate.outputs.decision == 'publish'
        env:
          PLUGIN_CATALOG_PRIVATE_KEY_BASE64: ${{ secrets.PLUGIN_CATALOG_PRIVATE_KEY_BASE64 }}
        run: |
          PLUGIN_CATALOG_PUBLIC_KEY="$(sed -n 's/^[[:space:]]*PLUGIN_CATALOG_PUBLIC_KEY[[:space:]]*=[[:space:]]*//p' Configs/Release.xcconfig | head -n 1)"
          [[ -n "$PLUGIN_CATALOG_PUBLIC_KEY" ]] || { echo "Plugin catalog public key is missing." >&2; exit 1; }
          scripts/plugins/verify-plugin-catalog-key-pair.sh \
            --public-key-base64 "$PLUGIN_CATALOG_PUBLIC_KEY"

      - name: Install native Voice Assistant SDK toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin

      - name: Show Xcode version
        if: steps.nightly_gate.outputs.decision == 'publish'
        run: xcodebuild -version

      - name: Install XcodeGen
        if: steps.nightly_gate.outputs.decision == 'publish'
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Write release local config
        if: steps.nightly_gate.outputs.decision == 'publish'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          BUNDLE_IDENTIFIER_PREFIX: ${{ secrets.BUNDLE_IDENTIFIER_PREFIX }}
        run: |
          umask 077
          cat > LocalConfig.xcconfig <<EOF
          DEVELOPMENT_TEAM = ${APPLE_DEVELOPMENT_TEAM}
          BUNDLE_IDENTIFIER_PREFIX = ${BUNDLE_IDENTIFIER_PREFIX}
          EOF

      - name: Run contributor-testable validation
        if: steps.nightly_gate.outputs.decision == 'publish'
        run: |
          make ci \
            DERIVED_DATA="$DERIVED_DATA" \
            BUILD_DESTINATION="platform=macOS" \
            XCODEBUILD=xcodebuild

      - name: Import Developer ID certificate
        if: steps.nightly_gate.outputs.decision == 'publish'
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          umask 077
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          trap 'rm -f "$CERT_PATH"' EXIT
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$DEVELOPER_ID_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "Developer ID Application identity was not found in imported certificate." >&2
            exit 1
          fi

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Build unsigned Nightly app and plugins
        if: steps.nightly_gate.outputs.decision == 'publish'
        run: |
          ./scripts/xcodebuild-filtered.sh \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$DERIVED_DATA" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            PLUGIN_CATALOG_URL="https://mactools.ggbond.app/${NIGHTLY_PLUGIN_CATALOG_RELATIVE_PATH#docs/}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build \
            -quiet

          scripts/nightly-release.py verify-app \
            --app "$DERIVED_DATA/Build/Products/Nightly/$APP_PRODUCT_NAME.app" \
            --cli "$DERIVED_DATA/Build/Products/Nightly/mactools" \
            --bundle-identifier-prefix "${{ secrets.BUNDLE_IDENTIFIER_PREFIX }}" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --plugin-kit-version "$PLUGIN_KIT_VERSION"

      - name: Prepare arm64 Nightly CLI
        if: steps.nightly_gate.outputs.decision == 'publish'
        run: |
          CLI_PATH="$DERIVED_DATA/Build/Products/Nightly/mactools"
          CLI_ARCHS="$(/usr/bin/lipo -archs "$CLI_PATH")"
          if [[ "$CLI_ARCHS" != "arm64" ]]; then
            [[ " $CLI_ARCHS " == *" arm64 "* ]] || { echo "Nightly CLI does not contain arm64." >&2; exit 1; }
            THIN_CLI_PATH="$RUNNER_TEMP/mactools-arm64"
            trap 'rm -f "$THIN_CLI_PATH"' EXIT
            /usr/bin/lipo "$CLI_PATH" -thin arm64 -output "$THIN_CLI_PATH"
            chmod 755 "$THIN_CLI_PATH"
            mv "$THIN_CLI_PATH" "$CLI_PATH"
          fi
          [[ "$(/usr/bin/lipo -archs "$CLI_PATH")" == "arm64" ]] \
            || { echo "Nightly CLI is not exactly arm64." >&2; exit 1; }

      - name: Sign app bundle
        if: steps.nightly_gate.outputs.decision == 'publish'
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/Nightly/$APP_PRODUCT_NAME.app"
          ENTITLEMENTS="Configs/MacTools.entitlements"
          FINDER_SYNC_ENTITLEMENTS="Sources/Extensions/RightClickFinderSync/RightClickFinderSync-Nightly.entitlements"
          SPARKLE_FRAMEWORK="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          SPARKLE_CURRENT="$SPARKLE_FRAMEWORK/Versions/Current"

          sign_path() {
            /usr/bin/codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" --options runtime --timestamp "$1"
          }

          sign_path_with_entitlements() {
            /usr/bin/codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" --options runtime --timestamp --entitlements "$2" "$1"
          }

          sign_path_preserving_entitlements() {
            /usr/bin/codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" --options runtime --timestamp --preserve-metadata=entitlements "$1"
          }

          if [[ -d "$SPARKLE_FRAMEWORK" ]]; then
            [[ ! -d "$SPARKLE_CURRENT/XPCServices/Installer.xpc" ]] || sign_path "$SPARKLE_CURRENT/XPCServices/Installer.xpc"
            [[ ! -d "$SPARKLE_CURRENT/XPCServices/Downloader.xpc" ]] || sign_path_preserving_entitlements "$SPARKLE_CURRENT/XPCServices/Downloader.xpc"
            [[ ! -f "$SPARKLE_CURRENT/Autoupdate" ]] || sign_path "$SPARKLE_CURRENT/Autoupdate"
            [[ ! -d "$SPARKLE_CURRENT/Updater.app" ]] || sign_path "$SPARKLE_CURRENT/Updater.app"
          fi

          while IFS= read -r binary; do
            [[ -n "$binary" ]] || continue
            sign_path "$binary"
          done < <(find "$APP_PATH/Contents" -type f \( -name "*.dylib" -o -name "*.so" \) -print)

          while IFS= read -r bundle; do
            [[ -n "$bundle" ]] || continue
            if [[ "$bundle" == *"/Sparkle.framework" || "$bundle" == *"/Sparkle.framework/"* ]]; then
              continue
            fi
            if [[ "$(basename "$bundle")" == "RightClickFinderSync.appex" ]]; then
              sign_path_with_entitlements "$bundle" "$FINDER_SYNC_ENTITLEMENTS"
            else
              sign_path "$bundle"
            fi
          done < <(find "$APP_PATH/Contents" -depth -type d \( -name "*.framework" -o -name "*.app" -o -name "*.xpc" -o -name "*.appex" \) -print)

          # The broker is a plain executable, so the bundle/dylib loops above do not sign it.
          CLI_BROKER="$APP_PATH/Contents/MacOS/MacToolsCLIBroker"
          [[ -f "$CLI_BROKER" ]] || { echo "Nightly CLI broker is missing" >&2; exit 1; }
          sign_path "$CLI_BROKER"

          # The separately downloadable CLI is not embedded in the app.
          CLI_PATH="$DERIVED_DATA/Build/Products/Nightly/mactools"
          [[ -f "$CLI_PATH" ]] || { echo "Nightly CLI is missing" >&2; exit 1; }
          sign_path "$CLI_PATH"
          scripts/nightly-release.py package-cli --cli "$CLI_PATH" --output "$CLI_ARCHIVE_PATH"
          python3 scripts/cli-install-manifest.py \
            --archive "$CLI_ARCHIVE_PATH" --app "$APP_PATH" \
            --source-release "$PLUGIN_ASSET_BASE_URL" --source-commit "$SOURCE_SHA" \
            --team "${{ secrets.APPLE_DEVELOPMENT_TEAM }}" \
            --output "$ARTIFACT_ROOT/cli-install.json"

          [[ ! -d "$SPARKLE_FRAMEWORK" ]] || sign_path "$SPARKLE_FRAMEWORK"
          /usr/bin/codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --options runtime \
            --timestamp \
            --entitlements "$ENTITLEMENTS" \
            "$APP_PATH"

          FINDER_SYNC_APPEX="$APP_PATH/Contents/PlugIns/RightClickFinderSync.appex"
          FINDER_SYNC_EXTENSION_POINT="$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$FINDER_SYNC_APPEX/Contents/Info.plist")"
          if [[ "$FINDER_SYNC_EXTENSION_POINT" != "com.apple.FinderSync" ]]; then
            echo "Finder Sync extension point is invalid: $FINDER_SYNC_EXTENSION_POINT" >&2
            exit 1
          fi
          FINDER_SYNC_SIGNED_ENTITLEMENTS="$(/usr/bin/codesign -d --entitlements :- "$FINDER_SYNC_APPEX" 2>/dev/null || true)"
          if [[ "$FINDER_SYNC_SIGNED_ENTITLEMENTS" != *"com.apple.security.app-sandbox"* ]]; then
            echo "Finder Sync extension is missing app sandbox entitlement" >&2
            exit 1
          fi
          if [[ "$FINDER_SYNC_SIGNED_ENTITLEMENTS" != *"com.apple.security.temporary-exception.files.home-relative-path.read-only"* ]]; then
            echo "Finder Sync extension is missing right-click config read entitlement" >&2
            exit 1
          fi
          if [[ "$FINDER_SYNC_SIGNED_ENTITLEMENTS" != *"MacTools Nightly/right-click-menu.json"* ]]; then
            echo "Finder Sync extension is missing the Nightly configuration entitlement" >&2
            exit 1
          fi
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          scripts/nightly-release.py verify-app \
            --app "$APP_PATH" --cli "$CLI_PATH" --signed \
            --bundle-identifier-prefix "${{ secrets.BUNDLE_IDENTIFIER_PREFIX }}" \
            --version "$VERSION" --build-number "$BUILD_NUMBER" \
            --plugin-kit-version "$PLUGIN_KIT_VERSION"

      - name: Build and sign same-commit Nightly plugins
        if: steps.nightly_gate.outputs.decision == 'publish'
        env:
          PLUGIN_CATALOG_PRIVATE_KEY_BASE64: ${{ secrets.PLUGIN_CATALOG_PRIVATE_KEY_BASE64 }}
          BUNDLE_IDENTIFIER_PREFIX: ${{ secrets.BUNDLE_IDENTIFIER_PREFIX }}
        run: |
          CODE_SIGN_KEYCHAIN="$KEYCHAIN_PATH" \
            scripts/plugins/build-plugin-release-assets.sh \
              --source-dir Plugins \
              --build-dir "$PLUGIN_BUILD_DIR" \
              --dist-dir "$ARTIFACT_ROOT" \
              --assets-dir "$PLUGIN_ASSETS_DIR" \
              --products-dir "$DERIVED_DATA/Build/Products/Nightly" \
              --base-url "$PLUGIN_ASSET_BASE_URL" \
              --catalog-output "$PLUGIN_CATALOG_PATH" \
              --signed-catalog-output "$SIGNED_PLUGIN_CATALOG_PATH" \
              --sign-identity "$SIGNING_IDENTITY" \
              --configuration Nightly \
              --release-notes-url "$PLUGIN_RELEASE_NOTES_URL" \
              --nightly-build-number "$BUILD_NUMBER"

          scripts/nightly-release.py verify-helper-signatures \
            --packages-dir "$PLUGIN_BUILD_DIR/Packages" \
            --bundle-identifier-prefix "$BUNDLE_IDENTIFIER_PREFIX"

          scripts/nightly-release.py verify-catalog \
            --catalog "$SIGNED_PLUGIN_CATALOG_PATH" \
            --plugins-dir Plugins \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --build-number "$BUILD_NUMBER"

          PLUGIN_CATALOG_PUBLIC_KEY="$(sed -n 's/^[[:space:]]*PLUGIN_CATALOG_PUBLIC_KEY[[:space:]]*=[[:space:]]*//p' Configs/Release.xcconfig | head -n 1)"
          [[ -n "$PLUGIN_CATALOG_PUBLIC_KEY" ]] || { echo "Plugin catalog public key is missing." >&2; exit 1; }
          xcrun swift scripts/plugins/preflight-app-plugin-catalog.swift \
            --app-version "$VERSION" \
            --catalog-url "https://mactools.ggbond.app/${NIGHTLY_PLUGIN_CATALOG_RELATIVE_PATH#docs/}" \
            --expected-catalog "$SIGNED_PLUGIN_CATALOG_PATH" \
            --public-key-base64 "$PLUGIN_CATALOG_PUBLIC_KEY" \
            --deployed-catalog "$SIGNED_PLUGIN_CATALOG_PATH" \
            --required-plugin-kit-version "$PLUGIN_KIT_VERSION"

      - name: Create and sign Nightly DMG
        if: steps.nightly_gate.outputs.decision == 'publish'
        env:
          BUNDLE_IDENTIFIER_PREFIX: ${{ secrets.BUNDLE_IDENTIFIER_PREFIX }}
        run: |
          APP_PATH="$DERIVED_DATA/Build/Products/Nightly/$APP_PRODUCT_NAME.app"
          STAGE_DIR="$(mktemp -d "$RUNNER_TEMP/mactools-nightly-dmg.XXXXXX")"
          mkdir -p "$(dirname "$DMG_PATH")"
          ditto "$APP_PATH" "$STAGE_DIR/$APP_PRODUCT_NAME.app"
          ln -s /Applications "$STAGE_DIR/Applications"
          hdiutil create -volname "$APP_PRODUCT_NAME" -srcfolder "$STAGE_DIR" -fs HFS+ -ov -format UDZO -imagekey zlib-level=9 "$DMG_PATH" >/dev/null
          /bin/rm -rf "$STAGE_DIR"
          /usr/bin/codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --timestamp \
            --identifier "${BUNDLE_IDENTIFIER_PREFIX}.mactools.nightly.disk-image" \
            "$DMG_PATH"
          /usr/bin/codesign --verify --verbose=2 "$DMG_PATH"

      - name: Notarize Nightly app and CLI distributions
        if: steps.nightly_gate.outputs.decision == 'publish'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          umask 077
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          trap 'rm -f "$API_KEY_PATH"' EXIT
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$API_KEY_PATH"

          notarize_and_require_accepted() {
            local artifact="$1"
            local result_path="$2"
            local submit_status=0
            xcrun notarytool submit "$artifact" \
              --key "$API_KEY_PATH" \
              --key-id "$ASC_API_KEY_ID" \
              --issuer "$ASC_API_ISSUER_ID" \
              --wait \
              --timeout 30m \
              --output-format json > "$result_path" || submit_status=$?
            if [[ "$submit_status" -ne 0 ]] \
              || ! scripts/nightly-release.py verify-notarization --input "$result_path"; then
              request_id="$(jq -r 'if (.id | type) == "string" then .id else empty end' "$result_path" 2>/dev/null || true)"
              if [[ -n "$request_id" ]]; then
                xcrun notarytool log "$request_id" \
                  --key "$API_KEY_PATH" \
                  --key-id "$ASC_API_KEY_ID" \
                  --issuer "$ASC_API_ISSUER_ID" || true
              fi
              return 1
            fi
          }

          notarize_and_require_accepted "$DMG_PATH" "$RUNNER_TEMP/dmg-notarization.json"
          notarize_and_require_accepted "$CLI_ARCHIVE_PATH" "$RUNNER_TEMP/cli-notarization.json"
          xcrun stapler staple "$DMG_PATH"
          spctl -a -t open --context context:primary-signature -v "$DMG_PATH"

      - name: Remove release signing keychain before appcast signing
        if: steps.nightly_gate.outputs.decision == 'publish'
        run: |
          [[ -n "${KEYCHAIN_PATH:-}" ]] || { echo "Release signing keychain path is missing." >&2; exit 1; }
          security delete-keychain "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=" >> "$GITHUB_ENV"

      - name: Generate Nightly notes, checksums, and statically verify CLI
        if: steps.nightly_gate.outputs.decision == 'publish'
        run: |
          DMG_DIRECTORY="$(dirname "$DMG_PATH")"
          DMG_NAME="$(basename "$DMG_PATH")"
          (cd "$DMG_DIRECTORY" && shasum -a 256 "$DMG_NAME") | tee "$SHA256_PATH"
          CLI_DIRECTORY="$(dirname "$CLI_ARCHIVE_PATH")"
          CLI_NAME="$(basename "$CLI_ARCHIVE_PATH")"
          (cd "$CLI_DIRECTORY" && shasum -a 256 "$CLI_NAME") | tee "$CLI_SHA256_PATH"
          scripts/nightly-release.py verify-cli-archive \
            --archive "$CLI_ARCHIVE_PATH" \
            --checksum "$CLI_SHA256_PATH" \
            --bundle-identifier-prefix "${{ secrets.BUNDLE_IDENTIFIER_PREFIX }}" \
            --team-identifier "${{ secrets.APPLE_DEVELOPMENT_TEAM }}" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --skip-execution
          RELEASE_NOTES_PATH="$ARTIFACT_ROOT/nightly-release-notes.md"
          scripts/nightly-release.py notes \
            --output "$RELEASE_NOTES_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --source-sha "$SOURCE_SHA"
          echo "RELEASE_NOTES_PATH=$RELEASE_NOTES_PATH" >> "$GITHUB_ENV"

      - name: Generate signed Nightly appcast
        if: steps.nightly_gate.outputs.decision == 'publish'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          umask 077
          NIGHTLY_APPCAST_PATH="$ARTIFACT_ROOT/nightly-appcast.xml"
          SIGN_UPDATE="$DERIVED_DATA/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          if [[ ! -x "$SIGN_UPDATE" ]]; then
            SIGN_UPDATE="$(find "$DERIVED_DATA/SourcePackages" -path "*/Sparkle/bin/sign_update" -type f -perm -111 | head -n 1)"
          fi
          [[ -n "$SIGN_UPDATE" && -x "$SIGN_UPDATE" ]] || { echo "Sparkle sign_update tool was not found." >&2; exit 1; }
          SPARKLE_KEY_PATH="$RUNNER_TEMP/sparkle_ed25519_key"
          trap 'rm -f "$SPARKLE_KEY_PATH"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY_PATH"
          SIGN_OUTPUT="$("$SIGN_UPDATE" "$DMG_PATH" --ed-key-file "$SPARKLE_KEY_PATH")"
          ED_SIGNATURE="$(printf '%s' "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"

          scripts/nightly-release.py appcast \
            --output "$NIGHTLY_APPCAST_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --signature "$ED_SIGNATURE" \
            --file-size "$(stat -f '%z' "$DMG_PATH")" \
            --publication-date "$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')" \
            --release-notes "$RELEASE_NOTES_PATH"
          echo "NIGHTLY_APPCAST_PATH=$NIGHTLY_APPCAST_PATH" >> "$GITHUB_ENV"

      - name: Write public CLI verification context
        if: steps.nightly_gate.outputs.decision == 'publish'
        env:
          BUNDLE_IDENTIFIER_PREFIX: ${{ secrets.BUNDLE_IDENTIFIER_PREFIX }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          jq -n \
            --arg bundleIdentifierPrefix "$BUNDLE_IDENTIFIER_PREFIX" \
            --arg teamIdentifier "$APPLE_DEVELOPMENT_TEAM" \
            '{bundleIdentifierPrefix: $bundleIdentifierPrefix, teamIdentifier: $teamIdentifier}' \
            > "$ARTIFACT_ROOT/cli-verification-context.json"

      - name: Upload immutable Nightly candidate
        id: nightly_candidate
        if: steps.nightly_gate.outputs.decision == 'publish'
        uses: actions/upload-artifact@v4
        with:
          name: MacTools-Nightly-${{ github.run_number }}.${{ github.run_attempt }}
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.SHA256_PATH }}
            ${{ env.CLI_ARCHIVE_PATH }}
            ${{ env.ARTIFACT_ROOT }}/cli-install.json
            ${{ env.CLI_SHA256_PATH }}
            ${{ env.SIGNED_PLUGIN_CATALOG_PATH }}
            ${{ env.PLUGIN_ASSETS_DIR }}/*.mactoolsplugin.zip
            ${{ env.ARTIFACT_ROOT }}/nightly-release-notes.md
            ${{ env.ARTIFACT_ROOT }}/nightly-appcast.xml
            ${{ env.ARTIFACT_ROOT }}/cli-verification-context.json
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup keychain
        if: always() && steps.nightly_gate.outputs.decision == 'publish'
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  verify_cli:
    name: Execute immutable Nightly CLI without credentials
    needs: build
    if: needs.build.outputs.decision == 'publish'
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout selected source without credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set Nightly metadata
        env:
          BUILD_RUN_ATTEMPT: ${{ needs.build.outputs.run_attempt }}
        run: |
          scripts/nightly-release.py metadata \
            --app-version-config Configs/AppVersion.xcconfig \
            --plugins-dir Plugins \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "${{ needs.build.outputs.source_sha }}" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "$BUILD_RUN_ATTEMPT" \
            --github-env "$GITHUB_ENV"

      - name: Download immutable Nightly candidate
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ env.ARTIFACT_ROOT }}

      - name: Verify and execute archived CLI
        run: |
          CONTEXT_PATH="$ARTIFACT_ROOT/cli-verification-context.json"
          BUNDLE_IDENTIFIER_PREFIX="$(jq -er '.bundleIdentifierPrefix | select(type == "string" and test("^[A-Za-z0-9.-]+$"))' "$CONTEXT_PATH")"
          TEAM_IDENTIFIER="$(jq -er '.teamIdentifier | select(type == "string" and test("^[A-Z0-9]{10}$"))' "$CONTEXT_PATH")"
          scripts/nightly-release.py verify-cli-archive \
            --archive "$CLI_ARCHIVE_PATH" \
            --checksum "$CLI_SHA256_PATH" \
            --bundle-identifier-prefix "$BUNDLE_IDENTIFIER_PREFIX" \
            --team-identifier "$TEAM_IDENTIFIER" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER"

  publish:
    name: Publish verified Nightly
    needs: [build, verify_cli]
    if: needs.build.outputs.decision == 'publish'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout selected source without credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set Nightly metadata
        env:
          BUILD_RUN_ATTEMPT: ${{ needs.build.outputs.run_attempt }}
        run: |
          scripts/nightly-release.py metadata \
            --app-version-config Configs/AppVersion.xcconfig \
            --plugins-dir Plugins \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "${{ needs.build.outputs.source_sha }}" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "$BUILD_RUN_ATTEMPT" \
            --github-env "$GITHUB_ENV"

      - name: Download verified immutable Nightly candidate
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ env.ARTIFACT_ROOT }}

      - name: Set transferred artifact paths
        run: |
          {
            echo "RELEASE_NOTES_PATH=$ARTIFACT_ROOT/nightly-release-notes.md"
            echo "NIGHTLY_APPCAST_PATH=$ARTIFACT_ROOT/nightly-appcast.xml"
          } >> "$GITHUB_ENV"

      - name: Create immutable-by-workflow draft prerelease
        id: nightly_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Nightly release $TAG already exists; published assets are never overwritten." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --target "$SOURCE_SHA" \
            --draft \
            --prerelease \
            --latest=false \
            --title "MacTools Nightly — Unstable ($BUILD_NUMBER)" \
            --notes-file "$RELEASE_NOTES_PATH"

          NIGHTLY_RELEASE_ID="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          [[ "$NIGHTLY_RELEASE_ID" =~ ^[0-9]+$ ]] || { echo "Cannot determine the created Nightly release ID." >&2; exit 1; }
          echo "release_id=$NIGHTLY_RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload and publish verified Nightly assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_CATALOG_PATH="$RUNNER_TEMP/catalog.json"
          cp "$SIGNED_PLUGIN_CATALOG_PATH" "$RELEASE_CATALOG_PATH"
          assets=(
            "$DMG_PATH"
            "$SHA256_PATH"
            "$CLI_ARCHIVE_PATH"
            "$CLI_SHA256_PATH"
            "$ARTIFACT_ROOT/cli-install.json"
            "$RELEASE_CATALOG_PATH"
          )
          while IFS= read -r asset; do
            [[ -n "$asset" ]] && assets+=("$asset")
          done < <(find "$PLUGIN_ASSETS_DIR" -maxdepth 1 -name "*.mactoolsplugin.zip" -type f -print | sort)
          gh release upload "$TAG" "${assets[@]}"

          EXPECTED_ASSETS_PATH="$RUNNER_TEMP/nightly-expected-assets.txt"
          {
            echo "MacTools-Nightly.dmg"
            echo "MacTools-Nightly.sha256"
            basename "$CLI_ARCHIVE_PATH"
            basename "$CLI_SHA256_PATH"
            echo "catalog.json"
            echo "cli-install.json"
            find "$PLUGIN_ASSETS_DIR" -maxdepth 1 -name "*.mactoolsplugin.zip" -type f -exec basename {} \; | sort
          } | sort > "$EXPECTED_ASSETS_PATH"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/nightly-actual-assets.txt"
          diff -u "$EXPECTED_ASSETS_PATH" "$RUNNER_TEMP/nightly-actual-assets.txt"
          gh release edit "$TAG" --draft=false --prerelease --latest=false
          RELEASE_STATE="$(gh release view "$TAG" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
          if [[ "$RELEASE_STATE" != $'false\ttrue' ]]; then
            echo "Nightly release has unexpected publication state: $RELEASE_STATE" >&2
            exit 1
          fi
          LATEST_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$LATEST_TAG" == "$TAG" ]]; then
            echo "Nightly release unexpectedly replaced the stable Latest release." >&2
            exit 1
          fi

      - name: Apply bounded Nightly retention
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASES_PATH="$RUNNER_TEMP/nightly-releases.json"
          RELEASE_PAGES_PATH="$RUNNER_TEMP/nightly-release-pages.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$RELEASE_PAGES_PATH"
          jq 'flatten | map({databaseId: .id, tagName: .tag_name, isDraft: .draft, isPrerelease: .prerelease, publishedAt: .published_at})' \
            "$RELEASE_PAGES_PATH" > "$RELEASES_PATH"

          scripts/nightly-release.py stale-draft-ids \
            --input "$RELEASES_PATH" \
            > "$RUNNER_TEMP/stale-nightly-draft-ids.txt"
          while IFS= read -r stale_draft_id; do
            [[ -n "$stale_draft_id" ]] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$stale_draft_id"
          done < "$RUNNER_TEMP/stale-nightly-draft-ids.txt"

          PRESERVE_TAG_ARGS=()
          COMMITTED_APPCAST_PATH="$RUNNER_TEMP/committed-nightly-appcast.xml"
          if git show "origin/main:$NIGHTLY_APPCAST_RELATIVE_PATH" > "$COMMITTED_APPCAST_PATH" 2>/dev/null; then
            COMMITTED_TAG="$(scripts/nightly-release.py appcast-tag --input "$COMMITTED_APPCAST_PATH")"
            PRESERVE_TAG_ARGS+=(--preserve-tag "$COMMITTED_TAG")
          fi

          DEPLOYED_APPCAST_PATH="$RUNNER_TEMP/deployed-nightly-appcast.xml"
          if curl --fail --silent --show-error --location \
            "https://mactools.ggbond.app/nightly/appcast.xml" \
            --output "$DEPLOYED_APPCAST_PATH" \
            && DEPLOYED_TAG="$(scripts/nightly-release.py appcast-tag --input "$DEPLOYED_APPCAST_PATH")"; then
            PRESERVE_TAG_ARGS+=(--preserve-tag "$DEPLOYED_TAG")
          else
            echo "The deployed Nightly appcast is unavailable; skipping retention to preserve rollback safety."
            exit 0
          fi

          # Older hosts still use the packages referenced by their last compatible catalog.
          # Read the committed paths so rollback refs do not need a newer release helper.
          COMMITTED_CATALOGS="$(git ls-tree -r --name-only origin/main docs/nightly/plugins)"
          while IFS= read -r catalog_path; do
            [[ "$catalog_path" == */catalog.json ]] || continue
            CATALOG_TAGS="$(git show "origin/main:$catalog_path" | jq -er \
              '[.plugins[].package.url | capture("/releases/download/(?<tag>nightly-[0-9]+-[0-9]+)/").tag] | unique[]')"
            while IFS= read -r catalog_tag; do
              PRESERVE_TAG_ARGS+=(--preserve-tag "$catalog_tag")
            done <<< "$CATALOG_TAGS"
          done <<< "$COMMITTED_CATALOGS"

          scripts/nightly-release.py stale-tags \
            --input "$RELEASES_PATH" \
            --keep "$NIGHTLY_RETENTION_COUNT" \
            "${PRESERVE_TAG_ARGS[@]}" \
            > "$RUNNER_TEMP/stale-nightly-tags.txt"
          while IFS= read -r stale_tag; do
            [[ -n "$stale_tag" ]] || continue
            gh release delete "$stale_tag" --cleanup-tag --yes
          done < "$RUNNER_TEMP/stale-nightly-tags.txt"

      - name: Publish dedicated Nightly catalog and appcast last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code "$SOURCE_SHA" -- \
            docs/appcast.xml \
            docs/app-release.json \
            docs/plugins \
            Configs/AppVersion.xcconfig \
            .github/workflows/release.yml \
            .github/workflows/plugin-release.yml

          cp "$SIGNED_PLUGIN_CATALOG_PATH" "$RUNNER_TEMP/nightly-plugin-catalog.json"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B nightly-publish-main origin/main
          mkdir -p "$(dirname "$NIGHTLY_PLUGIN_CATALOG_RELATIVE_PATH")"
          mkdir -p "$(dirname "$NIGHTLY_APPCAST_RELATIVE_PATH")"
          cp "$RUNNER_TEMP/nightly-plugin-catalog.json" "$NIGHTLY_PLUGIN_CATALOG_RELATIVE_PATH"
          cp "$NIGHTLY_APPCAST_PATH" "$NIGHTLY_APPCAST_RELATIVE_PATH"
          git add "$NIGHTLY_PLUGIN_CATALOG_RELATIVE_PATH" "$NIGHTLY_APPCAST_RELATIVE_PATH"

          CHANGED_PATHS="$(git diff --cached --name-only)"
          EXPECTED_PATHS="$(printf '%s\n%s\n' "$NIGHTLY_APPCAST_RELATIVE_PATH" "$NIGHTLY_PLUGIN_CATALOG_RELATIVE_PATH" | sort)"
          if [[ "$(printf '%s\n' "$CHANGED_PATHS" | sort)" != "$EXPECTED_PATHS" ]]; then
            echo "Nightly publication attempted to modify unexpected paths:" >&2
            printf '%s\n' "$CHANGED_PATHS" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Nightly metadata did not change; refusing to advance the feed." >&2
            exit 1
          fi
          git commit -m "ci: publish MacTools Nightly $BUILD_NUMBER"
          git push origin HEAD:main

      - name: Cleanup incomplete Nightly draft
        if: failure() && steps.nightly_release.outputs.release_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NIGHTLY_RELEASE_ID="${{ steps.nightly_release.outputs.release_id }}"
          if ! RELEASE_STATE="$(gh api "repos/$GITHUB_REPOSITORY/releases/$NIGHTLY_RELEASE_ID" \
            --jq '[.tag_name, .draft, .target_commitish] | @tsv')"; then
            echo "The incomplete Nightly release no longer exists; no cleanup is needed."
            exit 0
          fi
          IFS=$'\t' read -r RELEASE_TAG RELEASE_IS_DRAFT RELEASE_TARGET <<< "$RELEASE_STATE"
          if [[ "$RELEASE_TAG" != "$TAG" || "$RELEASE_TARGET" != "$SOURCE_SHA" ]]; then
            echo "Refusing to delete a Nightly release that does not match this workflow run." >&2
            exit 1
          fi
          if [[ "$RELEASE_IS_DRAFT" == "true" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$NIGHTLY_RELEASE_ID"
            echo "Deleted incomplete Nightly draft $TAG."
          else
            echo "Nightly release $TAG is already published; preserving it."
          fi
