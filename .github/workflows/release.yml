name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.9.2 or v0.9.2-beta.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PROJECT_NAME: MacTools
  SCHEME: MacTools
  DERIVED_DATA: build/DerivedData
  ARTIFACT_DIR: build/release
  # Enable only in a reviewed follow-up after issue #417 signed acceptance.
  STABLE_CLI_ENABLED: "false"

jobs:
  release:
    name: Build and notarize immutable release candidate
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      cli_enabled: ${{ steps.metadata.outputs.cli_enabled }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set release metadata
        id: metadata
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi

          VERSION="$(awk '$1 == "MARKETING_VERSION" && $2 == "=" { print $3; exit }' Configs/AppVersion.xcconfig)"
          BUILD_NUMBER="$(awk '$1 == "CURRENT_PROJECT_VERSION" && $2 == "=" { print $3; exit }' Configs/AppVersion.xcconfig)"
          TAG_VERSION="${TAG#v}"

          if [[ -z "$VERSION" || -z "$BUILD_NUMBER" ]]; then
            echo "MARKETING_VERSION and CURRENT_PROJECT_VERSION must be set in Configs/AppVersion.xcconfig" >&2
            exit 1
          fi
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "Release tag $TAG does not match Configs/AppVersion.xcconfig MARKETING_VERSION $VERSION" >&2
            exit 1
          fi
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Configs/AppVersion.xcconfig CURRENT_PROJECT_VERSION must be numeric" >&2
            exit 1
          fi

          PRERELEASE="false"
          if [[ "$VERSION" == *"-"* || "$VERSION" == *"beta"* || "$VERSION" == *"alpha"* || "$VERSION" == *"rc"* ]]; then
            PRERELEASE="true"
          fi

          {
            echo "TAG=$TAG"
            echo "VERSION=$VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "PRERELEASE=$PRERELEASE"
            echo "DMG_PATH=${ARTIFACT_DIR}/${TAG}/${PROJECT_NAME}.dmg"
            echo "SHA256_PATH=${ARTIFACT_DIR}/${TAG}/${PROJECT_NAME}.sha256"
          } >> "$GITHUB_ENV"

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "build_number=$BUILD_NUMBER"
            echo "prerelease=$PRERELEASE"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "cli_enabled=$STABLE_CLI_ENABLED"
          } >> "$GITHUB_OUTPUT"
          echo "CLI_ARCHIVE_PATH=${ARTIFACT_DIR}/${TAG}/mactools-cli-${VERSION}-${BUILD_NUMBER}-macos-arm64.zip" >> "$GITHUB_ENV"

      - name: Verify production plugin catalog
        run: |
          PREFLIGHT=scripts/plugins/preflight-app-plugin-catalog.swift
          args=(--app-version "$VERSION")
          if grep -Fq -- '"--use-current-catalog"' "$PREFLIGHT"; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            args+=(--use-current-catalog)
          fi
          "$PREFLIGHT" "${args[@]}"

      - name: Validate required secrets
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          BUNDLE_IDENTIFIER_PREFIX: ${{ secrets.BUNDLE_IDENTIFIER_PREFIX }}
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=0
          for name in \
            APPLE_DEVELOPMENT_TEAM \
            BUNDLE_IDENTIFIER_PREFIX \
            DEVELOPER_ID_CERT_P12 \
            DEVELOPER_ID_CERT_PASSWORD \
            ASC_API_KEY_P8_BASE64 \
            ASC_API_KEY_ID \
            ASC_API_ISSUER_ID \
            SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: $name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Install native Voice Assistant SDK toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Write release local config
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          BUNDLE_IDENTIFIER_PREFIX: ${{ secrets.BUNDLE_IDENTIFIER_PREFIX }}
        run: |
          umask 077
          cat > LocalConfig.xcconfig <<EOF
          DEVELOPMENT_TEAM = ${APPLE_DEVELOPMENT_TEAM}
          BUNDLE_IDENTIFIER_PREFIX = ${BUNDLE_IDENTIFIER_PREFIX}
          EOF

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "$DEVELOPER_ID_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "Developer ID Application identity was not found in imported certificate." >&2
            exit 1
          fi

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: make generate

      - name: Build unsigned Release app
        run: |
          catalog_build_settings=()
          # Recovery runs use the old tag's scripts with this workflow.
          if grep -Fq -- '--print-required-catalog-url' scripts/plugins/preflight-app-plugin-catalog.swift; then
            PLUGIN_CATALOG_URL="$(scripts/plugins/preflight-app-plugin-catalog.swift \
              --app-version "$VERSION" --print-required-catalog-url)"
            catalog_build_settings+=("PLUGIN_CATALOG_URL=$PLUGIN_CATALOG_URL")
          fi
          ./scripts/xcodebuild-filtered.sh \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "${DERIVED_DATA}" \
            MARKETING_VERSION="${VERSION}" \
            "${catalog_build_settings[@]}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build \
            -quiet

      - name: Package optional stable CLI and seal installation metadata
        if: env.STABLE_CLI_ENABLED == 'true'
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          CLI_PATH="$DERIVED_DATA/Build/Products/Release/mactools"
          APP_PATH="$DERIVED_DATA/Build/Products/Release/$PROJECT_NAME.app"
          CLI_ARCHS="$(lipo -archs "$CLI_PATH")"
          if [[ "$CLI_ARCHS" != "arm64" ]]; then
            lipo "$CLI_PATH" -thin arm64 -output "$CLI_PATH.arm64"
            mv "$CLI_PATH.arm64" "$CLI_PATH"
          fi
          [[ "$(lipo -archs "$CLI_PATH")" == "arm64" ]]
          /usr/bin/codesign --force --sign "$SIGNING_IDENTITY" --keychain "$KEYCHAIN_PATH" \
            --options runtime --timestamp "$CLI_PATH"
          scripts/nightly-release.py package-cli --cli "$CLI_PATH" --output "$CLI_ARCHIVE_PATH"
          python3 scripts/cli-install-manifest.py \
            --archive "$CLI_ARCHIVE_PATH" --app "$APP_PATH" \
            --source-release "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --source-commit "$(git rev-parse HEAD)" --team "$APPLE_DEVELOPMENT_TEAM" \
            --output "$(dirname "$CLI_ARCHIVE_PATH")/cli-install.json"

      - name: Reject stale CLI metadata when publication is disabled
        if: env.STABLE_CLI_ENABLED != 'true'
        run: |
          test ! -e "$DERIVED_DATA/Build/Products/Release/$PROJECT_NAME.app/Contents/Resources/cli-install.json"

      - name: Sign app bundle
        run: |
          APP_PATH="${DERIVED_DATA}/Build/Products/Release/${PROJECT_NAME}.app"
          ENTITLEMENTS="Configs/MacTools.entitlements"
          FINDER_SYNC_ENTITLEMENTS="Sources/Extensions/RightClickFinderSync/RightClickFinderSync.entitlements"
          SPARKLE_FRAMEWORK="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          SPARKLE_CURRENT="$SPARKLE_FRAMEWORK/Versions/Current"

          sign_path() {
            /usr/bin/codesign \
              --force \
              --sign "$SIGNING_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" \
              --options runtime \
              --timestamp \
              "$1"
          }

          sign_path_with_entitlements() {
            /usr/bin/codesign \
              --force \
              --sign "$SIGNING_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" \
              --options runtime \
              --timestamp \
              --entitlements "$2" \
              "$1"
          }

          sign_path_preserving_entitlements() {
            /usr/bin/codesign \
              --force \
              --sign "$SIGNING_IDENTITY" \
              --keychain "$KEYCHAIN_PATH" \
              --options runtime \
              --timestamp \
              --preserve-metadata=entitlements \
              "$1"
          }

          if [[ -d "$SPARKLE_FRAMEWORK" ]]; then
            if [[ -d "$SPARKLE_CURRENT/XPCServices/Installer.xpc" ]]; then
              sign_path "$SPARKLE_CURRENT/XPCServices/Installer.xpc"
            fi
            if [[ -d "$SPARKLE_CURRENT/XPCServices/Downloader.xpc" ]]; then
              sign_path_preserving_entitlements "$SPARKLE_CURRENT/XPCServices/Downloader.xpc"
            fi
            if [[ -f "$SPARKLE_CURRENT/Autoupdate" ]]; then
              sign_path "$SPARKLE_CURRENT/Autoupdate"
            fi
            if [[ -d "$SPARKLE_CURRENT/Updater.app" ]]; then
              sign_path "$SPARKLE_CURRENT/Updater.app"
            fi
          fi

          while IFS= read -r binary; do
            [[ -n "$binary" ]] || continue
            sign_path "$binary"
          done < <(find "$APP_PATH/Contents" -type f \( -name "*.dylib" -o -name "*.so" \) -print)

          while IFS= read -r bundle; do
            [[ -n "$bundle" ]] || continue
            if [[ "$bundle" == *"/Sparkle.framework" || "$bundle" == *"/Sparkle.framework/"* ]]; then
              continue
            fi
            if [[ "$(basename "$bundle")" == "RightClickFinderSync.appex" ]]; then
              sign_path_with_entitlements "$bundle" "$FINDER_SYNC_ENTITLEMENTS"
            else
              sign_path "$bundle"
            fi
          done < <(find "$APP_PATH/Contents" -depth -type d \( -name "*.framework" -o -name "*.app" -o -name "*.xpc" -o -name "*.appex" \) -print)

          # The broker is a plain executable, so the bundle/dylib loops above do not sign it.
          CLI_BROKER="$APP_PATH/Contents/MacOS/MacToolsCLIBroker"
          [[ -f "$CLI_BROKER" ]] || { echo "Release CLI broker is missing" >&2; exit 1; }
          sign_path "$CLI_BROKER"

          if [[ -d "$SPARKLE_FRAMEWORK" ]]; then
            sign_path "$SPARKLE_FRAMEWORK"
          fi

          /usr/bin/codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --options runtime \
            --timestamp \
            --entitlements "$ENTITLEMENTS" \
            "$APP_PATH"

          FINDER_SYNC_APPEX="$APP_PATH/Contents/PlugIns/RightClickFinderSync.appex"
          FINDER_SYNC_EXTENSION_POINT="$(/usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$FINDER_SYNC_APPEX/Contents/Info.plist")"
          if [[ "$FINDER_SYNC_EXTENSION_POINT" != "com.apple.FinderSync" ]]; then
            echo "Finder Sync extension point is invalid: $FINDER_SYNC_EXTENSION_POINT" >&2
            exit 1
          fi
          FINDER_SYNC_SIGNED_ENTITLEMENTS="$(/usr/bin/codesign -d --entitlements :- "$FINDER_SYNC_APPEX" 2>/dev/null || true)"
          if [[ "$FINDER_SYNC_SIGNED_ENTITLEMENTS" != *"com.apple.security.app-sandbox"* ]]; then
            echo "Finder Sync extension is missing app sandbox entitlement" >&2
            exit 1
          fi
          if [[ "$FINDER_SYNC_SIGNED_ENTITLEMENTS" != *"com.apple.security.temporary-exception.files.home-relative-path.read-only"* ]]; then
            echo "Finder Sync extension is missing right-click config read entitlement" >&2
            exit 1
          fi

          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create and sign DMG
        env:
          BUNDLE_IDENTIFIER_PREFIX: ${{ secrets.BUNDLE_IDENTIFIER_PREFIX }}
        run: |
          APP_PATH="${DERIVED_DATA}/Build/Products/Release/${PROJECT_NAME}.app"
          STAGE_DIR="$(mktemp -d "${RUNNER_TEMP}/mactools-dmg.XXXXXX")"
          mkdir -p "$(dirname "$DMG_PATH")"

          ditto "$APP_PATH" "$STAGE_DIR/${PROJECT_NAME}.app"
          ln -s /Applications "$STAGE_DIR/Applications"

          hdiutil create \
            -volname "$PROJECT_NAME" \
            -srcfolder "$STAGE_DIR" \
            -fs HFS+ \
            -ov \
            -format UDZO \
            -imagekey zlib-level=9 \
            "$DMG_PATH" >/dev/null

          /bin/rm -rf "$STAGE_DIR"

          /usr/bin/codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN_PATH" \
            --timestamp \
            --identifier "${BUNDLE_IDENTIFIER_PREFIX}.mactools.disk-image" \
            "$DMG_PATH"

          /usr/bin/codesign --verify --verbose=2 "$DMG_PATH"

      - name: Notarize and staple DMG
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$API_KEY_PATH"

          xcrun notarytool submit "$DMG_PATH" \
            --key "$API_KEY_PATH" \
            --key-id "$ASC_API_KEY_ID" \
            --issuer "$ASC_API_ISSUER_ID" \
            --wait \
            --timeout 30m

          if [[ "$STABLE_CLI_ENABLED" == "true" ]]; then
            xcrun notarytool submit "$CLI_ARCHIVE_PATH" \
              --key "$API_KEY_PATH" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" \
              --wait --timeout 30m --output-format json > "$RUNNER_TEMP/cli-notarization.json"
            scripts/nightly-release.py verify-notarization --input "$RUNNER_TEMP/cli-notarization.json"
          fi

          xcrun stapler staple "$DMG_PATH"
          spctl -a -t open --context context:primary-signature -v "$DMG_PATH"
          rm -f "$API_KEY_PATH"

      - name: Compute SHA256
        run: |
          shasum -a 256 "$DMG_PATH" | tee "$SHA256_PATH"

      - name: Statically verify notarized stable CLI
        if: env.STABLE_CLI_ENABLED == 'true'
        env:
          BUNDLE_IDENTIFIER_PREFIX: ${{ secrets.BUNDLE_IDENTIFIER_PREFIX }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          CLI_DIR="$(dirname "$CLI_ARCHIVE_PATH")"
          (cd "$CLI_DIR" && shasum -a 256 "$(basename "$CLI_ARCHIVE_PATH")") > "$CLI_ARCHIVE_PATH.sha256"
          scripts/nightly-release.py verify-cli-archive --channel stable --skip-execution \
            --archive "$CLI_ARCHIVE_PATH" --checksum "$CLI_ARCHIVE_PATH.sha256" \
            --bundle-identifier-prefix "$BUNDLE_IDENTIFIER_PREFIX" --team-identifier "$APPLE_DEVELOPMENT_TEAM" \
            --version "$VERSION" --build-number "$BUILD_NUMBER"

      - name: Extract release notes from CHANGELOG
        run: |
          RELEASE_NOTES="$RUNNER_TEMP/release-notes.md"
          HIGHLIGHTS_PATH=".github/release-highlights/${TAG}.md"
          GENERATED_NOTES="$RUNNER_TEMP/release-notes.generated.md"

          python3 scripts/changelog.py extract \
            --tag "$TAG" \
            --output "$GENERATED_NOTES"

          if [[ -f "$HIGHLIGHTS_PATH" ]]; then
            cat "$HIGHLIGHTS_PATH" > "$RELEASE_NOTES"
            printf '\n\n' >> "$RELEASE_NOTES"
            cat "$GENERATED_NOTES" >> "$RELEASE_NOTES"
          else
            cat "$GENERATED_NOTES" > "$RELEASE_NOTES"
          fi

          SPARKLE_RELEASE_NOTES="$RUNNER_TEMP/sparkle-release-notes.md"
          python3 scripts/changelog.py compose-sparkle \
            --tag "$TAG" \
            --app-notes "$RELEASE_NOTES" \
            --output "$SPARKLE_RELEASE_NOTES"

          {
            echo "RELEASE_NOTES_PATH=$RELEASE_NOTES"
            echo "SPARKLE_RELEASE_NOTES_PATH=$SPARKLE_RELEASE_NOTES"
          } >> "$GITHUB_ENV"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SIGN_UPDATE="${DERIVED_DATA}/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          if [[ ! -x "$SIGN_UPDATE" ]]; then
            SIGN_UPDATE="$(find "${DERIVED_DATA}/SourcePackages" -path "*/Sparkle/bin/sign_update" -type f -perm -111 | head -n 1)"
          fi
          if [[ -z "$SIGN_UPDATE" || ! -x "$SIGN_UPDATE" ]]; then
            echo "Sparkle sign_update tool was not found." >&2
            exit 1
          fi

          SPARKLE_KEY_PATH="$RUNNER_TEMP/sparkle_ed25519_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_KEY_PATH"
          SIGN_OUTPUT="$("$SIGN_UPDATE" "$DMG_PATH" --ed-key-file "$SPARKLE_KEY_PATH")"
          rm -f "$SPARKLE_KEY_PATH"

          ED_SIGNATURE="$(printf '%s' "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          if [[ -z "$ED_SIGNATURE" ]]; then
            echo "Failed to extract Sparkle EdDSA signature." >&2
            exit 1
          fi

          FILE_SIZE="$(stat -f '%z' "$DMG_PATH")"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${PROJECT_NAME}.dmg"
          RELEASE_NOTES_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          FULL_RELEASE_NOTES_URL="https://github.com/${GITHUB_REPOSITORY}/releases"
          PUB_DATE="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          MINIMUM_SYSTEM_VERSION="14.0"
          export ED_SIGNATURE FILE_SIZE DOWNLOAD_URL RELEASE_NOTES_URL FULL_RELEASE_NOTES_URL PUB_DATE MINIMUM_SYSTEM_VERSION

          python3 <<'PY_APPCAST'
          import json
          import os
          import xml.sax.saxutils as xml
          from pathlib import Path

          values = {
              key: os.environ[key]
              for key in [
                  "PROJECT_NAME",
                  "VERSION",
                  "BUILD_NUMBER",
                  "DOWNLOAD_URL",
                  "RELEASE_NOTES_URL",
                  "FULL_RELEASE_NOTES_URL",
                  "PUB_DATE",
                  "FILE_SIZE",
                  "ED_SIGNATURE",
                  "MINIMUM_SYSTEM_VERSION",
              ]
          }
          release_notes = Path(os.environ["SPARKLE_RELEASE_NOTES_PATH"]).read_text(encoding="utf-8")
          cdata_release_notes = release_notes.replace("]]>", "]]]]><![CDATA[>")

          content = f'''<?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
              <channel>
                  <title>{xml.escape(values["PROJECT_NAME"])} Releases</title>
                  <description>Latest release metadata for {xml.escape(values["PROJECT_NAME"])}.</description>
                  <language>en</language>
                  <item>
                      <title>Version {xml.escape(values["VERSION"])}</title>
                      <link>{xml.escape(values["RELEASE_NOTES_URL"])}</link>
                      <sparkle:version>{xml.escape(values["BUILD_NUMBER"])}</sparkle:version>
                      <sparkle:shortVersionString>{xml.escape(values["VERSION"])}</sparkle:shortVersionString>
                      <description sparkle:format="markdown"><![CDATA[{cdata_release_notes}]]></description>
                      <sparkle:fullReleaseNotesLink>{xml.escape(values["FULL_RELEASE_NOTES_URL"])}</sparkle:fullReleaseNotesLink>
                      <pubDate>{xml.escape(values["PUB_DATE"])}</pubDate>
                      <enclosure url="{xml.escape(values["DOWNLOAD_URL"])}" length="{xml.escape(values["FILE_SIZE"])}" type="application/octet-stream" sparkle:edSignature="{xml.escape(values["ED_SIGNATURE"])}" />
                      <sparkle:minimumSystemVersion>{xml.escape(values["MINIMUM_SYSTEM_VERSION"])}</sparkle:minimumSystemVersion>
                  </item>
              </channel>
          </rss>
          '''
          Path("docs/appcast.xml").write_text(content, encoding="utf-8")
          if os.environ["PRERELEASE"] == "false":
              release_metadata = {
                  "version": values["VERSION"],
                  "downloadURL": values["DOWNLOAD_URL"],
                  "releaseNotesURL": values["RELEASE_NOTES_URL"],
              }
              Path("docs/app-release.json").write_text(
                  json.dumps(release_metadata, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY_APPCAST

          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("docs/appcast.xml")'
          python3 -m json.tool docs/app-release.json >/dev/null

      - name: Stage release metadata with immutable artifacts
        run: |
          RELEASE_DIR="$ARTIFACT_DIR/$TAG"
          cp "$RELEASE_NOTES_PATH" "$RELEASE_DIR/release-notes.md"
          cp docs/appcast.xml "$RELEASE_DIR/appcast.xml"
          if [[ "$PRERELEASE" == "false" ]]; then
            cp docs/app-release.json "$RELEASE_DIR/app-release.json"
          fi

      - name: Upload immutable release candidate
        id: candidate
        uses: actions/upload-artifact@v4
        with:
          name: MacTools-${{ env.TAG }}
          path: ${{ env.ARTIFACT_DIR }}/${{ env.TAG }}/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  verify_cli:
    name: Verify release candidate without signing or publication credentials
    needs: release
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout candidate source without credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.source_sha }}
          persist-credentials: false
      - name: Download immutable release candidate
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: candidate
      - name: Verify and execute optional CLI
        env:
          CLI_ENABLED: ${{ needs.release.outputs.cli_enabled }}
          VERSION: ${{ needs.release.outputs.version }}
          BUILD_NUMBER: ${{ needs.release.outputs.build_number }}
        run: |
          if [[ "$CLI_ENABLED" != "true" ]]; then
            test ! -e candidate/cli-install.json
            exit 0
          fi
          IDENTIFIER="$(jq -er '.signingIdentifier | select(test("^[A-Za-z0-9.-]+\\.mactools\\.cli$"))' candidate/cli-install.json)"
          PREFIX="${IDENTIFIER%.mactools.cli}"
          TEAM="$(jq -er '.teamIdentifier | select(test("^[A-Z0-9]{10}$"))' candidate/cli-install.json)"
          CLI_ARCHIVE="candidate/mactools-cli-$VERSION-$BUILD_NUMBER-macos-arm64.zip"
          scripts/nightly-release.py verify-cli-archive --channel stable \
            --archive "$CLI_ARCHIVE" --checksum "$CLI_ARCHIVE.sha256" \
            --bundle-identifier-prefix "$PREFIX" --team-identifier "$TEAM" \
            --version "$VERSION" --build-number "$BUILD_NUMBER"

  publish:
    name: Publish verified release
    needs: [release, verify_cli]
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      BUILD_NUMBER: ${{ needs.release.outputs.build_number }}
      PRERELEASE: ${{ needs.release.outputs.prerelease }}
      CLI_ENABLED: ${{ needs.release.outputs.cli_enabled }}
      DMG_PATH: candidate/MacTools.dmg
      SHA256_PATH: candidate/MacTools.sha256
      RELEASE_NOTES_PATH: candidate/release-notes.md
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.source_sha }}
          fetch-depth: 0
      - name: Download verified immutable release candidate
        uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.release.outputs.artifact_id }}
          path: candidate

      - name: Recheck production catalog before publishing
        run: |
          PREFLIGHT=scripts/plugins/preflight-app-plugin-catalog.swift
          args=(--app-version "$VERSION")
          # Workflow recovery can use a tagged verifier from before artifact validation.
          if grep -Fq -- '"--artifact-info-plist"' "$PREFLIGHT"; then
            mount_point="$(mktemp -d "${RUNNER_TEMP}/mactools-catalog-check.XXXXXX")"
            mounted=0
            trap 'if [[ "$mounted" -eq 1 ]]; then hdiutil detach "$mount_point" >/dev/null; fi; rmdir "$mount_point"' EXIT
            hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$DMG_PATH" >/dev/null
            mounted=1
            args+=(--artifact-info-plist "$mount_point/$PROJECT_NAME.app/Contents/Info.plist")
            if grep -Fq -- '"--build-number"' "$PREFLIGHT"; then
              args+=(--build-number "$BUILD_NUMBER")
            fi
          fi
          if grep -Fq -- '"--use-current-catalog"' "$PREFLIGHT"; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            args+=(--use-current-catalog)
          fi
          "$PREFLIGHT" "${args[@]}"

      - name: Restore generated release metadata
        run: |
          cp candidate/appcast.xml docs/appcast.xml
          if [[ "$PRERELEASE" == "false" ]]; then
            cp candidate/app-release.json docs/app-release.json
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ARGS=(--title "${PROJECT_NAME} ${VERSION}" --notes-file "$RELEASE_NOTES_PATH")
          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_ARGS+=(--prerelease --latest=false)
          else
            RELEASE_ARGS+=(--latest)
          fi

          ASSETS=("$DMG_PATH#${PROJECT_NAME}.dmg" "$SHA256_PATH#${PROJECT_NAME}.sha256")
          if [[ "$CLI_ENABLED" == "true" ]]; then
            CLI_ARCHIVE="candidate/mactools-cli-$VERSION-$BUILD_NUMBER-macos-arm64.zip"
            ASSETS+=("$CLI_ARCHIVE" "$CLI_ARCHIVE.sha256" "candidate/cli-install.json")
            # Signed app metadata binds exact CLI bytes; never replace assets under an existing tag.
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Refusing to overwrite a stable CLI release; use a new version and tag." >&2
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" "${RELEASE_ARGS[@]}"
          else
            gh release create "$TAG" "${ASSETS[@]}" "${RELEASE_ARGS[@]}"
          fi

      - name: Commit app release metadata to main
        run: |
          cp docs/appcast.xml "$RUNNER_TEMP/appcast.xml"
          if [[ "$PRERELEASE" == "false" ]]; then
            cp docs/app-release.json "$RUNNER_TEMP/app-release.json"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/appcast.xml" docs/appcast.xml
          git add docs/appcast.xml
          if [[ "$PRERELEASE" == "false" ]]; then
            cp "$RUNNER_TEMP/app-release.json" docs/app-release.json
            git add docs/app-release.json
          fi
          if git diff --cached --quiet; then
            echo "No app release metadata changes to commit."
          else
            git commit -m "ci: update app release metadata for ${TAG}"
            git push origin main
          fi
